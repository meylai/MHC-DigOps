<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housing Manager Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
    <div class="dashboard">
        <header class="header">
            <h1>Housing Manager Dashboard</h1>
            <p>Tenant management, maintenance request handling, and housing operations</p>
        </header>

        <section class="map-section">
            <h2>GIS Property Map</h2>
            <div id="map"></div>
        </section>

        <section class="details-section">
            <h2>House Details</h2>
            <div id="houseDetails">
                <p>Select a house marker to view details.</p>
            </div>
        </section>

        <section class="maintenance-requests-section">
            <h2>Maintenance Requests</h2>
            <table id="maintenanceRequestsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tenant</th>
                        <th>House</th>
                        <th>Description</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="tenants-section">
            <h2>Tenant Management</h2>
            <div class="tenant-actions">
                <button onclick="loadTenants()">Refresh Tenants</button>
                <div id="housingManagerActions">
                    <button onclick="showAddTenantForm()">Add New Tenant</button>
                </div>
            </div>
            <div id="addTenantForm">
                <h3>Add New Tenant</h3>
                <form onsubmit="addTenant(event)">
                    <input type="text" id="tenantName" placeholder="Tenant Name" required>
                    <label for="tenantHouseId">Tenant House</label>
                    <select id="tenantHouseId" required>
                        <option value="">Select House</option>
                    </select>
                    <label for="tenantRentStatus">Rent Status</label>
                    <select id="tenantRentStatus">
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="overdue">Overdue</option>
                    </select>
                    <button type="submit">Add Tenant</button>
                    <button type="button" onclick="hideAddTenantForm()">Cancel</button>
                </form>
            </div>
            <table id="tenantsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>House</th>
                        <th>Rent Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <div id="map-script-container">
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    </div>
    <script src="js/housing-manager-dashboard.js"></script>
</body>

</html>
