<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Payment Method</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <h2>Select Payment Method</h2>

        <button onclick="payWith('airtel')">
            Pay with Airtel Money
        </button>

        <button onclick="payWith('mpamba')">
            Pay with Mpamba
        </button>
    </div>

    <script>
        function payWith(method) {
            const amount = localStorage.getItem("rentAmount");

            alert(`Processing MWK ${amount} via ${method}`);
        }
    </script>
</body>
</html>
