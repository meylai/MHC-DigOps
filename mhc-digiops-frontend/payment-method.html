<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Payment Method</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <h2>Select Payment Method</h2>

        <button onclick="payWith('airtel')">
            Pay with Airtel Money
        </button>

        <button onclick="payWith('mpamba')">
            Pay with Mpamba
        </button>
    </div>

    <script>
        async function payWith(method) {
            const amount = localStorage.getItem("rentAmount");
            const email = localStorage.getItem("email");
            const tenantId = localStorage.getItem("tenantId");
            const houseId = localStorage.getItem("houseId");

            if (!amount || !email) {
                alert("Rent amount or email is missing. Please go back to your dashboard and try again.");
                return;
            }

            const response = await fetch(
                "http://localhost:3000/api/pay-rent",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        amount,
                        email,
                        method,
                        tenantId,
                        houseId
                    })
                }
            );

            const data = await response.json();

            if (response.ok && data.paymentUrl) {
                window.location.href = data.paymentUrl;
            } else {
                alert(`Payment failed: ${data.error || 'Unable to start checkout'}`);
            }
        }
    </script>
</body>
</html>
